apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafficgen
  namespace: shop
  labels:
    app: trafficgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trafficgen
  template:
    metadata:
      labels:
        app: trafficgen
    spec:
      containers:
        - name: trafficgen
          image: tidewatch-trafficgen:dev
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --target=http://frontend.shop:8080/work
            - --base=40
            - --amp=260
            - --period=20m
            - --noise=0.05
            - --seed=1
            - --epoch=${EPOCH}
          resources:
            requests:
              cpu: 100m
              memory: 64Mi

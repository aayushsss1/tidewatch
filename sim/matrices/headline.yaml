# Headline benchmark (needs the Azure 2019 data: scripts/bench/fetch-azure2019.sh, and an
# ANTHROPIC_API_KEY): 6 Azure workloads x {flash-3x, flash-5x, cascade-4x, control, and
# slow-start (180s pod startup) variants of flash-5x and cascade-4x}, plus the two B scenarios
# (adversarial note, wrong-time note), x 7 configs. 38 scenarios, all matched by the glob. The
# agent config repeats 5 times; every other config runs once. Paths are relative to this file.
scenarios:
  - ../scenarios/headline/*.yaml
configs:
  - hpa
  - keda-prometheus
  - keda-cron
  - regex-rule
  - tidewatch-baseline
  - tidewatch-agent
  - oracle
repeats:
  tidewatch-agent: 5

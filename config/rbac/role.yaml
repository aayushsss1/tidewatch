---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - tidewatch.dev
  resources:
  - tidepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tidewatch.dev
  resources:
  - tidepolicies/finalizers
  verbs:
  - update
- apiGroups:
  - tidewatch.dev
  resources:
  - tidepolicies/status
  verbs:
  - get
  - patch
  - update

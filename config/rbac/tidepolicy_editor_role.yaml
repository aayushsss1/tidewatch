# This rule is not used by the project tidewatch itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the tidewatch.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tidewatch
    app.kubernetes.io/managed-by: kustomize
  name: tidepolicy-editor-role
rules:
- apiGroups:
  - tidewatch.dev
  resources:
  - tidepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tidewatch.dev
  resources:
  - tidepolicies/status
  verbs:
  - get

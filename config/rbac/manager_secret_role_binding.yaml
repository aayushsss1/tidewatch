# Binds the namespaced Role generated into role.yaml (the secrets get rule for
# the Slack webhook Secret) to the manager. It is a Role, never a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: tidewatch
    app.kubernetes.io/managed-by: kustomize
  name: manager-secret-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system

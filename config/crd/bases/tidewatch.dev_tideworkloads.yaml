---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tideworkloads.tidewatch.dev
spec:
  group: tidewatch.dev
  names:
    kind: TideWorkload
    listKind: TideWorkloadList
    plural: tideworkloads
    singular: tideworkload
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.kind
      name: Kind
      type: string
    - jsonPath: .status.currentReplicas
      name: Replicas
      type: integer
    - jsonPath: .status.desiredReplicas
      name: Desired
      type: integer
    - jsonPath: .status.forecastPeak
      name: Peak
      type: string
    - jsonPath: .status.trustedModel
      name: Model
      type: string
    - jsonPath: .status.lastAction
      name: Last-Action
      type: string
    - jsonPath: .status.mode
      name: Mode
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TideWorkload is the Schema for the tideworkloads API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TideWorkloadSpec binds a workload to its policy. It is operator-owned.
            properties:
              policyRef:
                description: PolicyRef points at the TidePolicy governing a workload.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              targetRef:
                description: TargetRef points at a scalable workload.
                properties:
                  apiVersion:
                    minLength: 1
                    type: string
                  kind:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - policyRef
            - targetRef
            type: object
          status:
            description: TideWorkloadStatus defines the observed state of TideWorkload.
            properties:
              accuracy:
                items:
                  description: ModelAccuracy is one model's measured accuracy at a
                    lead time.
                  properties:
                    coverage:
                      type: string
                    leadSeconds:
                      format: int32
                      type: integer
                    model:
                      type: string
                    samples:
                      format: int32
                      type: integer
                    smape:
                      type: string
                  required:
                  - model
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentReplicas:
                format: int32
                type: integer
              decisions:
                description: Decisions are newest first, at most 5.
                items:
                  description: Decision records one scaling decision and what the
                    enforcer did with it.
                  properties:
                    desired:
                      description: Desired is the replica count before enforcement.
                      format: int32
                      type: integer
                    final:
                      description: Final is the replica count after enforcement.
                      format: int32
                      type: integer
                    reasons:
                      description: |-
                        Reasons lists enforcement reasons, e.g. max_step, cooldown, budget,
                        external_change, metrics_unavailable.
                      items:
                        type: string
                      type: array
                    source:
                      description: DecisionSource says which component produced a
                        decision.
                      type: string
                    time:
                      format: date-time
                      type: string
                    verdict:
                      description: Verdict is the enforcer's outcome for a decision.
                      type: string
                  required:
                  - desired
                  - final
                  - source
                  - time
                  - verdict
                  type: object
                maxItems: 5
                type: array
              desiredReplicas:
                format: int32
                type: integer
              forecastPeak:
                description: ForecastPeak is the trusted model's point peak over the
                  horizon.
                type: string
              forecasts:
                items:
                  description: ModelForecast is one model's forecast summary over
                    the horizon.
                  properties:
                    lower:
                      type: string
                    model:
                      type: string
                    peak:
                      type: string
                    peakTime:
                      format: date-time
                      type: string
                    upper:
                      type: string
                  required:
                  - model
                  type: object
                type: array
              lastAction:
                description: LastAction is a human-readable summary, e.g. "scale 2→5
                  (baseline)".
                type: string
              lastScaleDownTime:
                format: date-time
                type: string
              lastScaleUpTime:
                format: date-time
                type: string
              load:
                description: Load is the latest observed load.
                type: string
              mode:
                description: PolicyMode selects whether a policy only records decisions
                  or enforces them.
                enum:
                - Shadow
                - Active
                type: string
              peakTime:
                format: date-time
                type: string
              readyReplicas:
                format: int32
                type: integer
              timeToReady:
                description: TimeToReadyStatus summarizes observed pod time-to-ready.
                properties:
                  p50Seconds:
                    format: int32
                    type: integer
                  p90Seconds:
                    format: int32
                    type: integer
                  samples:
                    format: int32
                    type: integer
                type: object
              trustedModel:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

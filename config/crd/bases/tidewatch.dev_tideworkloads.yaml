                            type: integer
                          resultBytes:
                            format: int32
                            type: integer
                          tool:
                            type: string
                        required:
                        - tool
                        type: object
                      maxItems: 8
                      type: array
                    verdict:
                      description: Verdict is the enforcer's outcome for a decision.
                      type: string
                  required:
                  - desired
                  - final
                  - source
                  - time
                  - verdict
                  type: object
                maxItems: 5
                type: array
              desiredReplicas:

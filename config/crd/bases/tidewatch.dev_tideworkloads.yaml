                    expires:
                      format: date-time
                      type: string
                    incidentId:
                      type: string
                    override:
                      description: Override is a time-boxed minimum replica floor.
                      properties:
                        approvedBy:
                          type: string
                        end:
                          format: date-time
                          type: string
                        id:
                          type: string
                        incidentId:
                          type: string
                        minReplicas:

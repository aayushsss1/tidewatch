                            type: string
                          latencyMs:
                            format: int32
                            type: integer
                          resultBytes:
                            format: int32
                            type: integer
                          tool:
                            type: string
                        required:
                        - tool
                        type: object
                      maxItems: 8
                      type: array
                  required:
                  - confidence
                  - expires
                  - incidentId
                  - override
                  type: object
                maxItems: 3
                type: array
              readyReplicas:
                format: int32
                type: integer

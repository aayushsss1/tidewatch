                  properties:
                    desired:
                      description: Desired is the replica count before enforcement.
                      format: int32
                      type: integer
                    final:
                      description: Final is the replica count after enforcement.
                      format: int32
                      type: integer
                    incidentId:
                      type: string
                    model:
                      type: string
                    outcome:
                      description: Outcome is the retrospective score of an agent

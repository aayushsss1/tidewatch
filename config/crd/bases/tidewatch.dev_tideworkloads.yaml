                      properties:
                        needed:
                          type: boolean
                        scoredAt:
                          format: date-time
                          type: string
                        timely:
                          description: Timely is nil until it can be judged.
                          type: boolean
                        wastedReplicaMinutes:
                          pattern: ^[0-9]+(\.[0-9]+)?$
                          type: string
                      required:
                      - scoredAt
                      type: object
                    promptVersion:
                      type: string
                    provider:
                      type: string
                    reasons:
                      description: |-
                        Reasons lists enforcement reasons, e.g. max_step, cooldown, budget,
                        external_change, metrics_unavailable.
                      items:
                        type: string
                      type: array
                    source:
                      description: DecisionSource says which component produced a
                        decision.
                      type: string
                    time:
                      format: date-time
                      type: string
                    trace:
                      items:
